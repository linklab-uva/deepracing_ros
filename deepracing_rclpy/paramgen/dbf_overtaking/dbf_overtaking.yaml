dbf_overtaking:
  gpu:
    type: int
    default_value: -1
    description: "Which gpu index to use. negative means cpu"

  dynamics_gauss:
    order:
      type: int
      default_value: 48
      description: "Gauss-Legendre order across time for dynamics checking"
    stdev:
      type: double
      default_value: 0.2
      description: "Stdev to use in folded normal distribution for probability of dynamics violation"
    alpha:
      type: double
      default_value: 0.0
      description: "Alpha value for gauss-legendre integration of dynamics violation probability"
  dynamics_newton:
    stepsize:
      type: double
      default_value: 1.0
      description: "Stepsize to use in newton's method for dynamics ellipse"
    max_step:
      type: double
      default_value: 0.087266463
      description: "Maximum step between iterations of newton's method"
    iterations:
      type: int
      default_value: 6
      description: "Number of iterations to use in newton's method"
  extra_boundary_factor:
    type: double
    default_value: 0.1
    description: "Extra distance (as ratio of car width) to expand the boundaries. Negative value means shrink boundaries"
  bounds_newton:
    stepsize:
      type: double
      default_value: 1.0
      description: "Stepsize to use in newton's method for closest point on centerline"
    max_step:
      type: double
      default_value: 0.75
      description: "Maximum step between iterations of newton's method"
    iterations:
      type: int
      default_value: 2
      description: "Number of iterations to use in newton's method"
  bounds_gauss:
    order:
      type: int
      default_value: 32
      description: "Gauss-Legendre order across time for bounds checking"
    stdev:
      type: double
      default_value: 0.75
      description: "Stdev to use in folded normal distribution for probability of boundary violation"
    dr_samp:
      type: double
      default_value: 1.0
      description: "Spacing to presample the centerline for bounds checking"
    alpha:
      type: double
      default_value: 0.1
      description: "Alpha value for gauss-legendre integration of boundary violation probability"
  collision_gauss:
    gamma:
      type: double
      default_value: 0.9
      description: "Gamma value for collision probability computation"
    order_space:
      type: int
      default_value: 14
      description: "Gauss-Legendre order across space for collision probability computation"
    order_time:
      type: int
      default_value: 42
      description: "Gauss-Legendre order across time for collision probability computation"
    alpha:
      type: double
      default_value: 0.0
      description: "Alpha value for GLR algorithm on collision probability"
  compile_backend:
    type: string
    default_value: ""
    description: "What torch.compile backend to use. Default (empty string) means do not use compiled modules"
  Nparticles:
    type: int
    default_value: 256
    description: "How many particles in the dbf algorithm to use"
  kbezier:
    type: int
    default_value: 3
    description: "Order of bezier curves to use"
  max_iterations:
    type: int
    default_value: 9
    description: "Total max iterations for the outer loop of the dbf algorithm"
  Nsegments:
    type: int
    default_value: 3
    description: "Number of CBC segments to use in the DBF algorithm"
  car_dims:
    width:
      type: double
      default_value: 2.0
      description: "Assumed width of both vehicles"
    length:
      type: double
      default_value: 5.2
      description: "Assumed length of both vehicles"
  stdev_range:
    longitudinal:
      type: double_array
      default_value: [0.4, 1.5]
      description: "Range of longitudinal standard deviations to use for TV prediction. Eventually replace this with probabilitic prediction module"
    lateral:
      type: double_array
      default_value: [0.4, 1.0]
      description: "Range of lateral standard deviations to use for TV prediction. Eventually replace this with probabilitic prediction module"
  buffer_factor:
    longitudinal:
      type: double
      default_value: 0.75
      description: "Buffer factor to apply for collision avoidance in the longitudinal direction (0.5 is no extra buffer)"
    lateral:
      type: double
      default_value: 0.75
      description: "Buffer factor to apply for collision avoidance in the lateral direction (0.5 is no extra buffer)"
  time_horizon:
    type: double
    default_value: 7.0
    description: "Time horizon to use in planning"
  timescale:
    type: double
    default_value: 0.75
    description: "Scale the speeds on the optimal raceline by this value"
  controlpoint_noise:
    lateral:
      type: double
      default_value: 0.875
      description: "Noise factor to apply to particles in the lateral direction"
    longitudinal:
      type: double
      default_value: 1.0
      description: "Noise factor to apply to particles in the longitudinal direction. Negative value means use 0.5*lateral noise"
    final:
      type: double
      default_value: 1.0
      description: "Noise factor to apply to the ending arclength on the raceline. Negative value means use 0.5*longitudinal noise"
  min_particle_likelihood:
    type: double
    default_value: 0.000001
    description: "Force all particles to have at least this likelihood"
  dynamic_limits:
    braking:
      scale_factor:
        type: double
        default_value: 1.0
      speeds:
        type: double_array
        default_value: [-1.0,    0.00,    25.190,  40.192,  64.544,  75.197,  89.330,  1000.0]
      limits: 
        type: double_array
        default_value: [-14.574,  -14.574, -14.574, -17.701, -21.424, -23.359, -25.593, -25.593]
    lateral_acceleration:
      scale_factor:
        type: double
        default_value: 1.0
      speeds:
        type: double_array
        default_value: [ -1.00,   0.0,    19.0,   75.850,  91.069,  1000.0]
      limits: 
        type: double_array
        default_value: [ 12.224,   12.224, 16.224, 35.156,  40.218,  40.218]
    longitudinal_acceleration:
      scale_factor:
        type: double
        default_value: 1.0
      speeds:
        type: double_array
        default_value: [-1.0,    0.0,    24.102,  40.192,  48.237,  59.325, 75.850, 91.069, 92.5,  1000.0]
      limits: 
        type: double_array
        default_value: [ 14.162,   14.162, 14.162,  12.971,  12.375,  9.546,  4.484,  0.464,  0.0,   0.0]





